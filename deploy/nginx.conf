# Hidden Glow — nginx reverse proxy
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hiddenglow.pk
#   sudo ln -s /etc/nginx/sites-available/hiddenglow.pk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file to add the TLS listener:
#   sudo certbot --nginx -d hiddenglow.pk -d www.hiddenglow.pk
#
# Replace hiddenglow.pk and APP_ROOT below if you deploy elsewhere.

server {
    listen 80;
    listen [::]:80;
    server_name hiddenglow.pk www.hiddenglow.pk;

    client_max_body_size 25M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ML service — must come before /api/ so it wins the longer prefix match.
    location /api/ml/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # NestJS API
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Product/category images, served straight off disk.
    # APP_ROOT must match the directory the repo is cloned into.
    location /uploads/ {
        alias /var/www/hiddenglow.pk/backend/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Next.js build output — long-lived, content-hashed filenames.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js storefront and admin
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
